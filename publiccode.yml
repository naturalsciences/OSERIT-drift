description:
  en:
    localisedName: OSERIT-drift
    shortDescription: Multipurpose Lagrangian tracking model to simulate trajectory
      drift at sea with currents, wind and waves.
    longDescription: >
      OSERIT-drift (Oil Spill Evaluation and Response Integrated Tool) is a
      multipurpose Lagrangian tracking model that simulates the trajectory drift
      of particles at sea. It can take ocean currents, wind and waves into
      account, and includes a random walk algorithm.
      Simulations are run from the command line using JSON configuration and
      request files together with hydrodynamic and meteorological forcing data,
      and results are written as NetCDF files. A test suite and an installation
      script are provided, along with example simulation files.
    documentation: https://github.com/naturalsciences/OSERIT-drift/blob/main/README.md
    features:
      - Lagrangian tracking of drift at sea
      - Drift driven by currents, wind and waves
      - Random walk algorithm
      - Simulation set-up through JSON configuration and request files
      - Results written in NetCDF format
      - Automated installation script and test suite
      - Example simulation files included
